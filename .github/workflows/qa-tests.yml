name: QA CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dev requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f BackEnd/requirements-dev.txt ]; then pip install -r BackEnd/requirements-dev.txt; fi
      - name: Run backend tests
        run: |
          cd BackEnd
          pytest -q
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --json > pip_audit.json || true

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd FrontEnd
          pnpm install --frozen-lockfile || pnpm install
      - name: Run frontend tests
        run: |
          cd FrontEnd
          pnpm run test:frontend || true
      - name: Run npm audit
        run: |
          cd FrontEnd
          pnpm audit --json > npm_audit.json || true
